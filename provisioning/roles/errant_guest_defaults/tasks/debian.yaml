---
# ==============================================================================
# Debian / Ubuntu Environment & Terminal Defaults
# ==============================================================================

- name: Install base terminal and editing packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - vim
      - bash-completion
      - ncurses-term
      - socat
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set vim.basic as default system editor alternative
  community.general.alternatives:
    name: editor
    path: /usr/bin/vim.basic
  failed_when: false

- name: Configure 256-color terminal fallback in /etc/profile.d/term.sh
  ansible.builtin.template:
    src: term.sh.j2
    dest: /etc/profile.d/term.sh
    owner: root
    group: root
    mode: "0644"

- name: Configure system-wide editor environment in /etc/profile.d/editor.sh
  ansible.builtin.template:
    src: editor.sh.j2
    dest: /etc/profile.d/editor.sh
    owner: root
    group: root
    mode: "0644"

- name: Persist EDITOR in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^EDITOR='
    line: 'EDITOR=vim'
    state: present

- name: Persist VISUAL in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^VISUAL='
    line: 'VISUAL=vim'
    state: present

- name: Ensure /etc/vim directory exists
  ansible.builtin.file:
    path: /etc/vim
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure global vim defaults in /etc/vim/vimrc.local
  ansible.builtin.template:
    src: vimrc.local.j2
    dest: /etc/vim/vimrc.local
    owner: root
    group: root
    mode: "0644"

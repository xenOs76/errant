---
# ==============================================================================
# Errant Sample Ansible Playbook
#
# Demonstrates running tasks against the dynamic inventory generated by Errant
# (.errant/inventory.ini) targeting role groups: control_plane, worker, and all.
#
# Usage:
#   ansible-playbook -i .errant/inventory.ini --ssh-common-args="-F .errant/ssh_config" playbook.yaml
#   # Or with the provided ansible.cfg:
#   ansible-playbook playbook.yaml
# ==============================================================================

- name: Cluster Connectivity & System Diagnostics
  hosts: all
  gather_facts: true
  tasks:
    - name: Ping all nodes
      ansible.builtin.ping:

    - name: Display system facts
      ansible.builtin.debug:
        msg: >-
          Node {{ inventory_hostname }} ({{ ansible_host }}) running
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          with kernel {{ ansible_kernel }} (Architecture: {{ ansible_architecture }})

    - name: Verify passwordless sudo access
      ansible.builtin.command:
        cmd: whoami
      register: whoami_out
      changed_when: false
      become: true

    - name: Assert sudo privileges
      ansible.builtin.assert:
        that:
          - whoami_out.stdout == "root"
        fail_msg: "User {{ ansible_user }} does not have root privileges"
        success_msg: "User {{ ansible_user }} successfully verified sudo privileges"

    - name: Inspect memory availability
      ansible.builtin.debug:
        msg: "Total RAM: {{ ansible_memtotal_mb }} MB, Free RAM: {{ ansible_memfree_mb }} MB"

- name: Control Plane Node Verification
  hosts: control_plane
  gather_facts: false
  tasks:
    - name: Check for secondary data disk (/dev/vdb)
      ansible.builtin.command:
        cmd: lsblk -no NAME,SIZE,TYPE /dev/vdb
      register: vdb_check
      failed_when: false
      changed_when: false

    - name: Report control plane storage status
      ansible.builtin.debug:
        msg: >-
          Control plane node {{ inventory_hostname }}:
          {% if vdb_check.rc == 0 %}
          Secondary data disk (/dev/vdb) detected: {{ vdb_check.stdout }}
          {% else %}
          Secondary data disk not attached (expected on secondary control planes)
          {% endif %}

- name: Worker Node Verification
  hosts: worker
  gather_facts: false
  tasks:
    - name: Report worker node readiness
      ansible.builtin.debug:
        msg: "Worker node {{ inventory_hostname }} ({{ ansible_host }}) is online and ready"

- name: Cluster Summary
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print cluster overview
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "  Errant Cluster Diagnostics Complete   "
          - "========================================"
          - "Control Plane Nodes: {{ groups['control_plane'] | default([]) | length }}"
          - "Worker Nodes:        {{ groups['worker'] | default([]) | length }}"
          - "Total Nodes:         {{ groups['all'] | default([]) | length }}"
          - "All nodes verified reachable via Errant inventory and SSH configuration."
